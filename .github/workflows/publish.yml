name: verify-and-publish
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: robot-operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate quality contract
        run: python3 quality/check_score.py
      - name: Verify locked web dependencies
        working-directory: web
        run: npm ci --ignore-scripts && npm run typecheck && npm run build && npm audit --audit-level=high
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Run JVM tests and build runtime
        run: docker compose build test app
      - name: Create CI proxy network fixture
        run: docker network create --subnet 172.30.0.0/24 proxy-net
      - name: Start isolated runtime
        run: docker compose up -d --wait
      - name: Run API integration and concurrency suite
        run: python3 tests/integration.py
      - name: Verify Redis outage fallback
        run: docker compose stop redis && python3 tests/redis_failure.py
      - name: Inspect non-root runtime
        run: test "$(docker compose exec -T app id -u)" = 10001
      - name: Tear down ephemeral services
        if: always()
        run: |
          docker compose down -v
          docker network rm proxy-net || true

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  image:
    if: github.event_name == 'push'
    needs: [verify, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
