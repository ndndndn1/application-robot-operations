services:
  app:
    build: {context: ., target: runtime}
    image: ghcr.io/ndndndn1/robot-fleet-telemetry:latest
    ports: ["127.0.0.1:8803:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/fleet
      DATABASE_USER: fleet
      DATABASE_PASSWORD: fleet-local
      REDIS_HOST: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: fleet, POSTGRES_USER: fleet, POSTGRES_PASSWORD: fleet-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  test:
    build: {context: ., target: test}
    profiles: ["test"]
