services:
  app:
    build: {context: ., target: runtime}
    image: ghcr.io/ndndndn1/application-robot-operations:latest
    ports: ["127.0.0.1:8803:8080"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    cpus: 2.0
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/fleet
      DATABASE_USER: fleet
      DATABASE_PASSWORD: fleet-local
      REDIS_HOST: redis
      ROBOT_GATEWAY_URL: ${ROBOT_GATEWAY_URL:-http://physical-robot-interface:8080}
      ROBOT_TARGET_MODE: ${ROBOT_TARGET_MODE:-mock}
      ROBOT_ALLOW_REAL: ${ROBOT_ALLOW_REAL:-false}
      HTTP_PROXY: http://172.30.0.10:3128
      HTTPS_PROXY: http://172.30.0.10:3128
      NO_PROXY: 127.0.0.1,localhost,postgres,redis,physical-robot-interface
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      physical-robot-interface: {condition: service_healthy}
    networks: [backend, proxy]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    shm_size: 128m
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    environment: {POSTGRES_DB: fleet, POSTGRES_USER: fleet, POSTGRES_PASSWORD: fleet-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  physical-robot-interface:
    image: ghcr.io/ndndndn1/physical-robot-interface:latest
    restart: "no"
    user: "65532:65532"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  test:
    build: {context: ., target: test}
    profiles: ["test"]
networks:
  backend:
    internal: true
  proxy:
    external: true
    name: proxy-net
