spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/fleet}
    username: ${DATABASE_USER:fleet}
    password: ${DATABASE_PASSWORD:fleet-local}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 1s
      connect-timeout: 1s
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: robot-fleet-telemetry
server:
  shutdown: graceful
